# ============================================================================
# Global Server Configuration
# Shared options applied across all initialized model routes
# ============================================================================
[*]
ctx-size = 4096
jinja = true

# ============================================================================
# Model Presets
# Section names map directly to the model strings passed by your script
# ============================================================================

[Qwen/Qwen3-4B-GGUF:Q4_K_M]
hf = Qwen/Qwen3-4B-GGUF:Q4_K_M

[Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M]
hf = Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M

# Coder variant: NOT recommended as the cheap tier. Qwen2.5-Coder
# models have a documented quirk where they default to ```json code
# fences instead of the <tool_call> tags llama.cpp's parser expects,
# even with jinja templating on. Kept here for reference only.
[Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M]
hf = Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M

# Kept for reference / fallback. This model is unreliable at emitting
# well-formed tool calls (see the peg-native parse errors) and is not
# used as the cheap tier by default -- see .env.
[unsloth/Llama-3.2-1B-Instruct-GGUF:Q4_K_M]
hf = unsloth/Llama-3.2-1B-Instruct-GGUF:Q4_K_M